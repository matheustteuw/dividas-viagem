<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Arraial do Cabo</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --ink:#f0f6fc; --muted:#8b949e; --btn:#238636; --green:#3fb950; --warn:#d29922; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { color-scheme:dark; -webkit-text-size-adjust:100%; }
  body { margin:0; font:16px/1.55 "Mona Sans VF",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  a { color:inherit; text-decoration:none; }
  img { display:block; width:100%; height:100%; object-fit:cover; }
  .wrap { max-width:560px; margin:0 auto; padding:0 20px; }

  .hero { position:relative; min-height:78svh; display:flex; align-items:flex-end; overflow:hidden; }
  .hero img { position:absolute; inset:0; object-position:center 80%; }
  .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(13,17,23,.3),rgba(13,17,23,.1) 40%,var(--bg) 100%); }
  .hero .wrap { position:relative; z-index:1; width:100%; padding-bottom:28px; padding-top:calc(40px + env(safe-area-inset-top)); }
  h1 { font-size:clamp(2.8rem,14vw,4.5rem); line-height:1; letter-spacing:-.03em; margin:0 0 8px; text-shadow:0 2px 20px rgba(0,0,0,.4); }
  .hero p { margin:0 0 22px; color:#e6edf3; font-size:1.1rem; }
  .btn { display:flex; align-items:center; justify-content:center; min-height:58px; border-radius:8px; background:var(--btn); border:1px solid rgba(240,246,252,.2); color:#fff; font-weight:700; font-size:1.1rem; box-shadow:0 4px 20px rgba(35,134,54,.4); }
  .btn:hover { background:#2ea043; } .btn:active { transform:scale(.98); }

  h2 { font-size:1.15rem; margin:36px 0 12px; }
  .bar { height:8px; background:#21262d; border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--green); transition:width .6s; }
  .sub { color:var(--muted); font-size:.9rem; margin:8px 0 0; }
  .list { margin-top:16px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  .row { display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .st { font-size:.85rem; font-weight:600; color:var(--warn); } .st.ok { color:var(--green); }

  .photos { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:36px; }
  .photos div { aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--card); }
  footer { padding:36px 20px calc(36px + env(safe-area-inset-bottom)); text-align:center; color:var(--muted); font-size:.75rem; }
</style>
</head>
<body>

<header class="hero">
  <img src="fotos/prainha.jpg" alt="Prainha de Arraial do Cabo" fetchpriority="high">
  <div class="wrap">
    <h1>Arraial do Cabo</h1>
    <p>Viagem dos 6. Bora organizar os pagamentos.</p>
    <a class="btn" href="pagamentos.html">Iniciar pagamentos</a>
  </div>
</header>

<main class="wrap">
  <h2>Como estamos</h2>
  <div class="bar"><i id="bar"></i></div>
  <p class="sub" id="sub">Carregando…</p>
  <div class="list" id="list"></div>

  <div class="photos">
    <div><img src="fotos/praia-grande.jpg" alt="Praia Grande" loading="lazy"></div>
    <div><img src="fotos/barco.jpg" alt="Mar visto do barco" loading="lazy"></div>
    <div><img src="fotos/forno.jpg" alt="Porto de Arraial do Cabo" loading="lazy"></div>
    <div><img src="fotos/praia.jpg" alt="Pôr do sol na praia" loading="lazy"></div>
  </div>
</main>

<footer>Fotos: Noel Portugal (CC BY 2.0); Ivolindbergh, Edulonde e TMbux (CC BY-SA 3.0); Adriane Rado (CC BY-SA 4.0), via Wikimedia Commons.</footer>

<script>
const NAMES = ['2t bigode', 'Arthur', 'Laryssa', 'Gabi', 'Victor', 'Isa'];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const row = (n, st) => `<div class="row"><span>${esc(n)}</span>${st}</div>`;
document.getElementById('list').innerHTML = NAMES.map((n) => row(n, '')).join('');

fetch('/api/payments').then((r) => r.json()).then(({ items }) => {
  const paid = items.filter((i) => i.paidAt).length;
  document.getElementById('bar').style.width = Math.round((paid / items.length) * 100) + '%';
  document.getElementById('sub').textContent = `${paid} de ${items.length} parcelas pagas`;
  document.getElementById('list').innerHTML = NAMES.map((n) => {
    const open = items.filter((i) => i.from === n && !i.paidAt).length;
    return row(n, open ? `<span class="st">falta ${open}</span>` : '<span class="st ok">em dia</span>');
  }).join('');
}).catch(() => { document.getElementById('sub').textContent = 'Não consegui carregar os pagamentos.'; });
</script>
</body>
</html>
