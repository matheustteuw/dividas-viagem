<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dívidas da Viagem</title>
<style>
  :root {
    --bg:#f4f5f9; --card:#fff; --text:#171a2b; --muted:#7a8095; --line:#e8eaf1;
    --brand:#4f46e5; --brand-soft:#eef0ff; --ok:#16a34a; --ok-soft:#e8f7ee; --warn:#d97706; --warn-soft:#fef3e2; --danger:#dc2626;
    --shadow:0 1px 2px rgba(20,24,50,.04), 0 6px 20px rgba(20,24,50,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1020; --card:#171a2e; --text:#eceefa; --muted:#8b92ab; --line:#262a44;
      --brand:#818cf8; --brand-soft:#23274a; --ok:#4ade80; --ok-soft:#14301f; --warn:#fbbf24; --warn-soft:#3a2b10; --shadow:none; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:0 auto; padding:24px 16px 80px; }

  header h1 { font-size:1.5rem; margin:0; letter-spacing:-.02em; }
  header p { margin:4px 0 0; color:var(--muted); font-size:.9rem; }

  .summary { background:var(--card); border-radius:20px; padding:20px; margin:20px 0; box-shadow:var(--shadow); }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .stat small { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; }
  .stat strong { display:block; font-size:1.5rem; letter-spacing:-.02em; }
  .stat.pend strong { color:var(--warn); } .stat.paid strong { color:var(--ok); }
  .bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:16px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--ok)); border-radius:99px; transition:width .4s; }
  .bar-label { color:var(--muted); font-size:.8rem; margin-top:8px; }

  .tabs { display:flex; background:var(--line); border-radius:12px; padding:4px; gap:4px; margin-bottom:16px; }
  .tabs button { flex:1; border:0; background:transparent; color:var(--muted); font:inherit; font-weight:600; padding:9px; border-radius:9px; cursor:pointer; }
  .tabs button.on { background:var(--card); color:var(--text); box-shadow:var(--shadow); }

  .group { background:var(--card); border-radius:20px; box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden; }
  .group-h { padding:16px 18px 12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .group-h b { font-size:1rem; } .group-h span { color:var(--muted); font-size:.82rem; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 18px; border-top:1px solid var(--line); }
  .avatar { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; flex:none; }
  .who { flex:1; min-width:0; }
  .who b { display:block; font-weight:600; }
  .who small { color:var(--muted); }
  .amount { font-weight:700; white-space:nowrap; }
  .btn { border:0; font:inherit; font-weight:600; padding:8px 14px; border-radius:10px; cursor:pointer; background:var(--brand); color:#fff; }
  .btn.soft { background:var(--brand-soft); color:var(--brand); }
  .btn.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  .btn.ok { background:var(--ok); color:#fff; }
  .btn:disabled { opacity:.5; cursor:wait; }
  .badge { display:inline-block; font-size:.75rem; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--warn-soft); color:var(--warn); }
  .badge.ok { background:var(--ok-soft); color:var(--ok); }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }

  dialog { border:0; border-radius:20px; padding:24px; width:min(92vw,400px); background:var(--card); color:var(--text); box-shadow:0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background:rgba(10,12,30,.5); backdrop-filter:blur(2px); }
  dialog h2 { margin:0 0 4px; font-size:1.2rem; }
  dialog .detail { background:var(--bg); border-radius:14px; padding:14px; margin:14px 0; display:grid; gap:6px; }
  dialog .detail div { display:flex; justify-content:space-between; gap:12px; } dialog .detail span { color:var(--muted); }
  dialog label.field { display:block; font-size:.85rem; color:var(--muted); margin-bottom:12px; }
  dialog input[type=date] { display:block; width:100%; margin-top:4px; font:inherit; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  dialog label.check { display:flex; gap:10px; align-items:flex-start; font-size:.9rem; margin-bottom:18px; cursor:pointer; }
  dialog label.check input { margin-top:3px; width:18px; height:18px; flex:none; }
  .modal-actions { display:flex; gap:8px; } .modal-actions .btn { flex:1; padding:11px; }

  #toasts { position:fixed; left:0; right:0; bottom:20px; display:grid; gap:8px; justify-items:center; pointer-events:none; padding:0 16px; }
  .toast { background:#171a2b; color:#fff; padding:12px 18px; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.25); font-weight:500; animation:up .25s ease; }
  .toast.ok { background:var(--ok); } .toast.err { background:var(--danger); }
  @keyframes up { from { opacity:0; transform:translateY(12px); } }
</style>
</head>
<body>
<main>
  <header>
    <h1>✈️ Dívidas da viagem</h1>
    <p>Passagens no cartão do Matheus · Hospedagem no cartão da Isa</p>
  </header>

  <section class="summary">
    <div class="stats">
      <div class="stat pend"><small>Falta pagar</small><strong id="sPend">–</strong></div>
      <div class="stat paid"><small>Já pago</small><strong id="sPaid">–</strong></div>
    </div>
    <div class="bar"><i id="bar" style="width:0"></i></div>
    <div class="bar-label" id="barLabel"></div>
  </section>

  <nav class="tabs">
    <button data-tab="pend" class="on">⏳ Falta pagar</button>
    <button data-tab="paid">✅ Já pagaram</button>
  </nav>

  <div id="list"></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dTitle"></h2>
    <div class="detail" id="dDetail"></div>
    <label class="field" id="dDateWrap">Data do pagamento<input type="date" id="dDate" required></label>
    <label class="check"><input type="checkbox" id="dCheck" required><span id="dCheckText"></span></label>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="dCancel">Cancelar</button>
      <button type="submit" class="btn ok" id="dOk">Confirmar</button>
    </div>
  </form>
</dialog>
<div id="toasts"></div>

<script>
const $ = (id) => document.getElementById(id);
const brl = (n) => n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const fmt = (d) => d.split('-').reverse().join('/');
const today = () => new Date().toLocaleDateString('sv'); // AAAA-MM-DD no fuso local
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const COLORS = { Matheus:'#4f46e5', Laryssa:'#db2777', Gabriela:'#0891b2', Victor:'#ea580c', Isabelly:'#7c3aed' };
const avatar = (n) => `<div class="avatar" style="background:${COLORS[n] || '#64748b'}">${esc(n[0])}</div>`;

let items = [], tab = 'pend', current = null;

async function api(body) {
  const r = await fetch('/api/payments', body && { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error);
  return data.items;
}

function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  $('toasts').append(t);
  setTimeout(() => t.remove(), 3500);
}

function render() {
  const sum = (l) => l.reduce((s, i) => s + i.amount, 0);
  const pend = items.filter((i) => !i.paidAt), paid = items.filter((i) => i.paidAt);
  $('sPend').textContent = brl(sum(pend));
  $('sPaid').textContent = brl(sum(paid));
  const pct = items.length ? Math.round((paid.length / items.length) * 100) : 0;
  $('bar').style.width = pct + '%';
  $('barLabel').textContent = `${paid.length} de ${items.length} parcelas pagas (${pct}%)`;

  const shown = tab === 'pend' ? pend : paid;
  if (!shown.length) {
    $('list').innerHTML = `<div class="empty">${tab === 'pend' ? 'Tudo pago! 🎉' : 'Ninguém pagou ainda.'}</div>`;
    return;
  }
  const byCreditor = Object.groupBy(shown, (i) => i.to);
  $('list').innerHTML = Object.entries(byCreditor).map(([to, list]) => `
    <section class="group">
      <div class="group-h"><b>Pagar para ${esc(to)}</b><span>${esc(list[0].motivo)} · ${brl(sum(list))}</span></div>
      ${list.map((i) => `
        <div class="row">
          ${avatar(i.from)}
          <div class="who"><b>${esc(i.from)}</b><small>${i.paidAt ? `Pago em ${fmt(i.paidAt)}` : `Parcela ${esc(i.parcela)}`}</small></div>
          ${i.paidAt ? `<span class="badge ok">${esc(i.parcela)}</span>` : `<span class="amount">${brl(i.amount)}</span>`}
          <button class="btn ${i.paidAt ? 'ghost' : 'soft'}" data-id="${esc(i.id)}">${i.paidAt ? 'Desfazer' : 'Pagar'}</button>
        </div>`).join('')}
    </section>`).join('');
}

function openModal(item) {
  current = item;
  const undo = !!item.paidAt;
  $('dTitle').textContent = undo ? 'Desfazer pagamento?' : 'Confirmar pagamento';
  $('dDetail').innerHTML = `
    <div><span>De</span><b>${esc(item.from)}</b></div>
    <div><span>Para</span><b>${esc(item.to)}</b></div>
    <div><span>Parcela</span><b>${esc(item.parcela)} · ${esc(item.motivo)}</b></div>
    <div><span>Valor</span><b>${brl(item.amount)}</b></div>
    ${undo ? `<div><span>Pago em</span><b>${fmt(item.paidAt)}</b></div>` : ''}`;
  $('dDateWrap').hidden = undo;
  $('dDate').required = !undo;
  $('dDate').value = today();
  $('dDate').max = today();
  $('dCheck').checked = false;
  $('dCheckText').textContent = undo
    ? 'Entendo que essa parcela voltará para "Falta pagar".'
    : `Confirmo que ${item.from} já pagou ${brl(item.amount)} para ${item.to}.`;
  $('dOk').className = 'btn ' + (undo ? 'ghost' : 'ok');
  $('dOk').textContent = undo ? 'Desfazer' : 'Confirmar pagamento';
  $('dlg').showModal();
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const item = current, undo = !!item.paidAt;
  $('dOk').disabled = true;
  try {
    items = await api({ id:item.id, date:undo ? null : $('dDate').value });
    $('dlg').close();
    render();
    toast(undo ? `Pagamento de ${item.from} desfeito` : `✅ ${item.from} pagou ${brl(item.amount)} para ${item.to}!`, undo ? '' : 'ok');
  } catch (err) {
    toast('Erro: ' + err.message, 'err');
  } finally {
    $('dOk').disabled = false;
  }
});

$('dCancel').onclick = () => $('dlg').close();
$('dlg').addEventListener('click', (e) => { if (e.target === $('dlg')) $('dlg').close(); }); // clique no fundo

$('list').addEventListener('click', (e) => {
  const id = e.target.dataset.id;
  if (id) openModal(items.find((i) => i.id === id));
});
document.querySelector('.tabs').addEventListener('click', (e) => {
  if (!e.target.dataset.tab) return;
  tab = e.target.dataset.tab;
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b === e.target));
  render();
});

api().then((i) => { items = i; render(); }).catch((e) => toast('Erro: ' + e.message, 'err'));
</script>
</body>
</html>
